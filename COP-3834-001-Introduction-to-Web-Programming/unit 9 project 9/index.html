<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Petition Animation & Modal Demo</title>
  <style>
    /* Page Layout & Styling */
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 20px;
      background-color: #f4f7f6;
      color: #333;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #ccc;
      padding-bottom: 10px;
      margin-bottom: 20px;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    input, button {
      padding: 10px;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    button {
      background-color: #007bff;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background-color: #0056b3;
    }

    #reduce-motion-btn {
      background-color: #6c757d;
      font-size: 0.85rem;
    }

    /* --- Modal Styling --- */
    .modal {
      display: none; /* Hidden by default */
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.6);
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background-color: #ffffff;
      padding: 30px;
      border-radius: 12px;
      text-align: center;
      position: relative;
      max-width: 350px;
      width: 80%;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
    }

    .close-btn {
      position: absolute;
      top: 10px;
      right: 15px;
      background: none;
      color: #888;
      font-size: 1.8rem;
      border: none;
      cursor: pointer;
      padding: 0;
    }

    .close-btn:hover {
      color: #000;
      background: none;
    }

    #modal-img {
      width: 80px;
      height: 80px;
      margin-top: 15px;
      /* Smooth visual transition for size changes */
      transition: transform 0.05s linear; 
    }

    /* Reduce Motion Override */
    .reduce-motion * {
      animation: none !important;
      transition: none !important;
    }
  </style>
</head>
<body>

  <header>
    <h2>Save the Parks Petition</h2>
    <!-- Stretch Feature: Reduce Motion Button -->
    <button id="reduce-motion-btn">Reduce Motion</button>
  </header>

  <main>
    <p>Sign below to support our local parks!</p>
    
    <!-- Signature Form -->
    <form id="sign-petition">
      <label for="name">Name:</label>
      <input type="text" id="name" placeholder="Jane Doe" required>

      <label for="hometown">Hometown:</label>
      <input type="text" id="hometown" placeholder="Seattle" required>

      <label for="email">Email:</label>
      <input type="email" id="email" placeholder="jane@example.com" required>

      <button type="submit">Sign Petition</button>
    </form>

    <h3>Signatures (<span id="count">0</span>)</h3>
    <ul id="signatures-list"></ul>
  </main>

  <!-- Animated Modal Box -->
  <div id="thanks-modal" class="modal">
    <div class="modal-content">
      <!-- Stretch Feature: Close Button -->
      <button id="close-modal-btn" class="close-btn">&times;</button>
      <h2>Thank You!</h2>
      <p id="modal-text-container"></p>
      <!-- Animated Heart Icon -->
      <img id="modal-img" src="https://upload.wikimedia.org/wikipedia/commons/f/f1/Heart_coraz%C3%B3n.svg" alt="Heart Icon">
    </div>
  </div>

  <script>
    // Variables for timing & animation
    let intervalId;
    let timeoutId;
    let scaleFactor = 1;
    let scaleDirection = 0.02;
    let signatureCount = 0;

    // DOM Elements
    const modal = document.getElementById('thanks-modal');
    const modalText = document.getElementById('modal-text-container');
    const modalImage = document.getElementById('modal-img');
    const closeModalBtn = document.getElementById('close-modal-btn');
    const reduceMotionBtn = document.getElementById('reduce-motion-btn');
    const petitionForm = document.getElementById('sign-petition');

    // 1. Image Animation Function using setInterval
    function animateImage() {
      // If reduce motion is enabled, do not start interval
      if (document.body.classList.contains('reduce-motion')) {
        return;
      }

      intervalId = setInterval(() => {
        // Pulse size between 1.0x and 1.3x scale
        if (scaleFactor >= 1.3) {
          scaleDirection = -0.02;
        } else if (scaleFactor <= 1.0) {
          scaleDirection = 0.02;
        }
        scaleFactor += scaleDirection;
        modalImage.style.transform = `scale(${scaleFactor})`;
      }, 30);
    }

    // 2. Open Modal & trigger timeouts/intervals
    function toggleModal(person) {
      // Personalize message using object attributes
      modalText.textContent = `Thank you, ${person.name} from ${person.hometown}, for signing our petition!`;

      // Show modal box
      modal.style.display = 'flex';

      // Start pulsing image animation
      animateImage();

      // Automatically hide modal after 4 seconds using setTimeout
      timeoutId = setTimeout(() => {
        closeModal();
      }, 4000);
    }

    // 3. Close Modal and clear timers
    function closeModal() {
      modal.style.display = 'none';

      // Clear both JS timing functions
      clearInterval(intervalId);
      clearTimeout(timeoutId);

      // Reset image transform scale
      scaleFactor = 1;
      modalImage.style.transform = 'scale(1)';
    }

    // 4. Form Submit Handler
    function addSignature(event) {
      event.preventDefault();

      // Store inputs into a person Object
      const person = {
        name: document.getElementById('name').value,
        hometown: document.getElementById('hometown').value,
        email: document.getElementById('email').value
      };

      // Add name to list
      const list = document.getElementById('signatures-list');
      const newSignature = document.createElement('li');
      newSignature.textContent = `🖊️ ${person.name} from ${person.hometown}`;
      list.appendChild(newSignature);

      // Update signature count
      signatureCount++;
      document.getElementById('count').textContent = signatureCount;

      // Launch Modal passing the person object
      toggleModal(person);

      // Clear inputs
      petitionForm.reset();
    }

    // 5. Stretch Feature: Reduce Motion Toggle Handler
    function toggleReduceMotion() {
      document.body.classList.toggle('reduce-motion');

      if (document.body.classList.contains('reduce-motion')) {
        reduceMotionBtn.textContent = "Enable Motion";
        clearInterval(intervalId);
        modalImage.style.transform = 'scale(1)';
      } else {
        reduceMotionBtn.textContent = "Reduce Motion";
      }
    }

    // Event Listeners
    petitionForm.addEventListener('submit', addSignature);
    closeModalBtn.addEventListener('click', closeModal);
    reduceMotionBtn.addEventListener('click', toggleReduceMotion);
  </script>
</body>
</html>
